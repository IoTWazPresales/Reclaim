appId: com.fissioncorporation.reclaim
---
# Alpha smoke: wait for app to finish loading, then navigate by TAPPING the drawer
# (no screenshots until the app is ready — avoids white/rebundle screens)

- launchApp

# Wait for the main app UI (header with menu). Up to 30s so rebundle/auth can finish.
- extendedWaitUntil:
    visible:
      text: "Open navigation menu"
    timeout: 30000

- takeScreenshot: "01-home"

# Open drawer and go to Sleep
- tapOn:
    text: "Open navigation menu"
- waitForAnimationToEnd
- tapOn: "Sleep"
- waitForAnimationToEnd
- takeScreenshot: "02-sleep"

# Back to drawer, go to Mood
- tapOn:
    text: "Open navigation menu"
- waitForAnimationToEnd
- tapOn: "Mood"
- waitForAnimationToEnd
- takeScreenshot: "03-mood"

# Meds
- tapOn:
    text: "Open navigation menu"
- waitForAnimationToEnd
- tapOn: "Meds"
- waitForAnimationToEnd
- takeScreenshot: "04-meds"

