<!DOCTYPE html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=390"/>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Roboto,system-ui,sans-serif;background:#f8fafc;color:#0f172a}
.card{background:#ffffff;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.muted{color:#475569;font-size:13px;line-height:1.4}
.h1{font-size:24px;font-weight:800;margin:0}
.h2{font-size:18px;font-weight:700;margin:0}
.row{display:flex;gap:8px;align-items:center}
